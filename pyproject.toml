[build-system] 
requires = ["hatchling"]  
build-backend = "hatchling.build"    
      
[project]                  
name = "mountainash_utils_files"                
dynamic = ["version"]                 
description = 'Mountain Ash - Utils - Files'           
readme = "README.md"       
requires-python = ">=3.10"            
license = "MIT"                  
keywords = []           
authors = [   
  { name = "Nathaniel Ramm", email = "nathaniel.ramm@discretedatascience.com" },  
]   
classifiers = [    
  "Development Status :: 4 - Beta",     
  "Programming Language :: Python",  
  "Programming Language :: Python :: 3.10",    
  "Programming Language :: Python :: 3.11",   
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [     
  "pandas>=2.2.0",     
  "polars==1.16.0",     
  "pydantic==2.9.2",  
  "pydantic-settings==2.6.1", 
  "universal_pathlib==0.2.2", 
  "pyarrow==17.0.0",  
  "boltons==24.0.0", 
  # "paramiko==3.4.0",  
  # "gnupg==2.3.1",  
  
  # Move these to specific entrypoints once pattern developed.
  "minio==7.2.7", 
  "boto3==1.34.136", 
  "smart-open[all]==7.0.4",

  # "python-gnupg==0.5.2",  
  "lxml>=4.5.0",
  "xsdata[lxml]>=24.4",   
]  

  
[project.optional-dependencies]
s3 = [
  "boto3==1.34.136",
  # "smart-open[s3,ssh]==7.0.4", 
  "s3fs>=2023.1.0",
  "minio==7.2.7", 
] 
gcs = [ 
  "google-cloud-storage>=2.9.0",    
  "gcsfs>=2023.1.0", 
  # "smart-open[gcs,ssh]==7.0.4",   
] 
azure = [
  "azure-storage-blob>=12.13.0",  
  "adlfs>=2023.1.0",  
  # "smart-open[azure,ssh]==7.0.4", 
] 
sftp = [
  "paramiko==3.4.0", 
  "smart-open[ssh]==7.0.4", 

]
encryption = [
  "gnupg==2.3.1", 
  "python-gnupg==0.5.2",
]
all = [
  "boto3==1.34.136",   
  "smart-open[all]==7.0.4",
  "s3fs>=2023.1.0",
  "minio==7.2.7",   
  "google-cloud-storage>=2.9.0",
  "gcsfs>=2023.1.0",
  "azure-storage-blob>=12.13.0", 
  "adlfs>=2023.1.0",
  "paramiko==3.4.0",
  "gnupg==2.3.1",
  "python-gnupg==0.5.2",   
]

  

[project.urls]
Documentation = "https://github.com/mountainash-io/mountainash-utils-files#readme"
Issues = "https://github.com/mountainash-io/mountainash-utils-files/issues"
Source = "https://github.com/mountainash-io/mountainash-utils-files"

#================
# Tool: Coverage
#================ 
[tool.coverage.run]
source_pkgs = ["mountainash_utils_files", "tests"]
branch = true
parallel = true
omit = [
  "src/mountainash_utils_files/__version__.py",
]

[tool.coverage.paths]
mountainash_utils_files = ["src/mountainash_utils_files", "*/mountainash-utils-files/src/mountainash_utils_files"]
tests = ["tests", "*/mountainash-utils-files/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__:",
  "if TYPE_CHECKING:",
]
