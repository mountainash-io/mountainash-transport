[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mountainash_utils_files"
dynamic = ["version"]
description = 'Mountain Ash - Utils - Files'
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [
  { name = "Nathaniel Ramm", email = "nathaniel.ramm@discretedatascience.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "pandas==2.2.2",
  "polars==0.20.31",
  "pydantic==2.7.4",
  "pydantic-settings==2.2.1",
  "universal_pathlib==0.2.2",
  "pyarrow==15.0.2",
  "boltons==24.0.0",
  "paramiko==3.4.0",
  "gnupg==2.3.1",
  "minio==7.2.7",
  "boto3==1.34.136",
  "smart-open[s3]==7.0.4",
  "python-gnupg==0.5.2",
  "xsdata[lxml]==24.4",
]

[project.urls]
Documentation = "https://github.com/mountainash-io/mountainash-utils-files#readme"
Issues = "https://github.com/mountainash-io/mountainash-utils-files/issues"
Source = "https://github.com/mountainash-io/mountainash-utils-files"
