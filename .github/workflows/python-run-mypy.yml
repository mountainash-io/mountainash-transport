name: Mypy and installed typing

on:
  pull_request:
    paths:
      - src/mountainash_transport/**
      - tests/**
      - tools/**
      - docs/typing.md
      - AGENTS.md
      - pyproject.toml
      - hatch.toml
      - requirements-hatch.txt
      - .github/**
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      fallback_branch:
        description: Dependency fallback branch.
        required: true
        default: develop
        type: choice
        options:
          - develop
          - main

permissions:
  contents: read

jobs:
  typing:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - name: Set dependency branch variables
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FALLBACK_BRANCH: ${{ inputs.fallback_branch }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            echo "FALLBACK_BRANCH=$INPUT_FALLBACK_BRANCH" >> "$GITHUB_ENV"
            echo "TARGET_BRANCH=$REF_NAME" >> "$GITHUB_ENV"
          elif [[ "$EVENT_NAME" == push ]]; then
            echo "FALLBACK_BRANCH=$REF_NAME" >> "$GITHUB_ENV"
            echo "TARGET_BRANCH=$REF_NAME" >> "$GITHUB_ENV"
          else
            echo "FALLBACK_BRANCH=$BASE_REF" >> "$GITHUB_ENV"
            echo "TARGET_BRANCH=$HEAD_REF" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          check-latest: true

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: mountainash-io

      - name: Load dependencies
        id: dependencies
        uses: ./.github/actions/load-dependencies
        with:
          config-path: .github/config/mountainash_dependencies.yml

      - name: Check out dependencies
        uses: ./.github/actions/checkout-dependencies
        with:
          dependencies: ${{ steps.dependencies.outputs.dependencies }}
          target-branch: ${{ env.TARGET_BRANCH }}
          default-branch: ${{ env.FALLBACK_BRANCH }}
          token: ${{ steps.app-token.outputs.token }}
          org-name: mountainash-io

      - name: Unshallow typed dependency checkouts
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          auth_header=$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 --wrap=0)
          for repo in mountainash-settings mountainash-auth-client; do
            git -C "temp/$repo" -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" fetch --unshallow origin
          done

      - name: Create matrix interpreter environment
        env:
          EXPECTED_PYTHON: ${{ matrix.python }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/typing-source-evidence"
          python -m venv "$RUNNER_TEMP/typing-runner"
          runner="$RUNNER_TEMP/typing-runner/bin/python"
          "$runner" -c 'import os, sys; print(sys.version); assert ".".join(map(str, sys.version_info[:2])) == os.environ["EXPECTED_PYTHON"]' | tee "$RUNNER_TEMP/typing-source-evidence/python.log"
          # Same pins as the hatch mypy environment.
          "$runner" -m pip install 'build==1.2.2.post1' 'hatchling==1.27.0' 'mypy==1.10.1' 'pytest==8.3.5' \
            'boto3-stubs[s3]==1.43.117' 'types-PyYAML==6.0.12.20260906' 'types-paramiko==5.0.0.20261021' \
            'google-api-core>=2.11' \
            ./temp/mountainash-settings ./temp/mountainash-auth-client -e '.[s3,sftp,encryption]' 2>&1 | tee "$RUNNER_TEMP/typing-source-evidence/install.log"
          "$runner" -m pip freeze > "$RUNNER_TEMP/typing-source-evidence/dependencies.log"

      - name: Check all source and tests
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/typing-runner/bin/python" -m mypy src/mountainash_transport tests --warn-unused-ignores 2>&1 | tee "$RUNNER_TEMP/typing-source-evidence/mypy.log"

      - name: Qualify installed direct and rebuilt wheels
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/typing-runner/bin/python" tools/qualify_typing.py \
            --settings-source "$GITHUB_WORKSPACE/temp/mountainash-settings" \
            --auth-client-source "$GITHUB_WORKSPACE/temp/mountainash-auth-client" \
            --output "$RUNNER_TEMP/typing-installed" 2>&1 | tee "$RUNNER_TEMP/typing-source-evidence/qualify.log"

      - name: Upload typing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typing-${{ matrix.python }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/typing-source-evidence/
            ${{ runner.temp }}/typing-installed/receipt.json
            ${{ runner.temp }}/typing-installed/*.log
            ${{ runner.temp }}/typing-installed/direct/
            ${{ runner.temp }}/typing-installed/rebuilt/
            ${{ runner.temp }}/typing-installed/dependency/
            ${{ runner.temp }}/typing-installed/consumer-*/
