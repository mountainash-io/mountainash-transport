name: Build, Verify, and Publish Package

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified candidate to PyPI (main only)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build and verify candidate
    runs-on: ubuntu-24.04
    outputs:
      dist-artifact-id: ${{ steps.upload-dist.outputs.artifact-id }}
      evidence-artifact-id: ${{ steps.upload-evidence.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install public build tools
        env:
          RELEASE_ROOT: ${{ runner.temp }}/mountainash-release
        run: |
          mkdir -p "$RELEASE_ROOT/home"
          env -i PATH="$PATH" HOME="$RELEASE_ROOT/home" PIP_CONFIG_FILE=/dev/null PIP_INDEX_URL=https://pypi.org/simple PIP_DISABLE_PIP_VERSION_CHECK=1 \
            python -I -m pip install --isolated --no-input --index-url https://pypi.org/simple build twine

      - name: Build exactly one wheel and sdist
        env:
          RELEASE_ROOT: ${{ runner.temp }}/mountainash-release
        run: |
          rm -rf "$RELEASE_ROOT"
          mkdir -p "$RELEASE_ROOT/dist" "$RELEASE_ROOT/evidence" "$RELEASE_ROOT/home"
          env -i PATH="$PATH" HOME="$RELEASE_ROOT/home" PIP_CONFIG_FILE=/dev/null PIP_INDEX_URL=https://pypi.org/simple PIP_DISABLE_PIP_VERSION_CHECK=1 \
            python -I -m build --wheel --sdist --outdir "$RELEASE_ROOT/dist"
          test "$(find "$RELEASE_ROOT/dist" -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find "$RELEASE_ROOT/dist" -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          env -i PATH="$PATH" HOME="$RELEASE_ROOT/home" PIP_CONFIG_FILE=/dev/null \
            python -I -m twine check "$RELEASE_ROOT/dist"/*

      - name: Record approved artifact identity
        env:
          RELEASE_ROOT: ${{ runner.temp }}/mountainash-release
          PACKAGE_DISTRIBUTION: mountainash-transport
        run: |
          env -i PATH="$PATH" HOME="$RELEASE_ROOT/home" PIP_CONFIG_FILE=/dev/null \
            python -I - "$RELEASE_ROOT/dist" "$RELEASE_ROOT/evidence" "$PACKAGE_DISTRIBUTION" <<'PY'
          import hashlib
          import json
          import re
          import sys
          import zipfile
          from email.parser import Parser
          from pathlib import Path

          dist, evidence, expected_distribution = map(Path, sys.argv[1:])
          wheel, = dist.glob('*.whl')
          sdist, = dist.glob('*.tar.gz')
          with zipfile.ZipFile(wheel) as archive:
              metadata_name = next(name for name in archive.namelist() if name.endswith('.dist-info/METADATA'))
              metadata = Parser().parsestr(archive.read(metadata_name).decode())
          canonical_name = re.sub(r'[-_.]+', '-', metadata['Name']).lower()
          if canonical_name != str(expected_distribution):
              raise SystemExit(f'wheel canonical name is {canonical_name}, not {expected_distribution}')
          if metadata['Requires-Python'] != '>=3.12':
              raise SystemExit('Requires-Python must declare the approved >=3.12 support policy')
          requires_dist = sorted(metadata.get_all('Requires-Dist', []))
          if any('@' in requirement for requirement in requires_dist):
              raise SystemExit('wheel metadata contains a direct-reference dependency')
          files = {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in (wheel, sdist)}
          release = {
              'distribution': canonical_name,
              'version': metadata['Version'],
              'source_sha': '${{ github.sha }}',
              'repository': '${{ github.repository }}',
              'run_id': '${{ github.run_id }}',
              'run_attempt': '${{ github.run_attempt }}',
              'files': files,
          }
          (evidence / 'release.json').write_text(json.dumps(release, indent=2, sort_keys=True) + '\n')
          (evidence / 'SHA256SUMS').write_text(''.join(f'{digest}  {name}\n' for name, digest in sorted(files.items())))
          PY

      - name: Verify candidate wheel outside the checkout
        env:
          RELEASE_ROOT: ${{ runner.temp }}/mountainash-release
          PACKAGE_IMPORT: mountainash_transport
        run: |
          wheel=$(find "$RELEASE_ROOT/dist" -maxdepth 1 -name '*.whl' -print -quit)
          python -m venv "$RELEASE_ROOT/candidate-venv"
          (
            cd "$RELEASE_ROOT"
            env -i PATH="$PATH" HOME="$RELEASE_ROOT/home" PIP_CONFIG_FILE=/dev/null PIP_INDEX_URL=https://pypi.org/simple PIP_DISABLE_PIP_VERSION_CHECK=1 \
              "$RELEASE_ROOT/candidate-venv/bin/python" -I -m pip install --isolated --no-input --index-url https://pypi.org/simple --report "$RELEASE_ROOT/evidence/candidate-install-report.json" "$wheel"
            env -i PATH="$PATH" HOME="$RELEASE_ROOT/home" PIP_CONFIG_FILE=/dev/null \
              "$RELEASE_ROOT/candidate-venv/bin/python" -I -m pip check
            env -i PATH="$PATH" HOME="$RELEASE_ROOT/home" PIP_CONFIG_FILE=/dev/null \
              "$RELEASE_ROOT/candidate-venv/bin/python" -I - "$RELEASE_ROOT/evidence/candidate-install-report.json" "$wheel" "$RELEASE_ROOT/evidence/candidate-module-origin.txt" "$PACKAGE_IMPORT" <<'PY'
          import importlib
          import json
          import sys
          from pathlib import Path

          report, candidate, output, module_name = sys.argv[1:]
          allowed = (candidate and Path(candidate).resolve().as_uri(), 'https://pypi.org/', 'https://files.pythonhosted.org/')
          for item in json.loads(Path(report).read_text()).get('install', []):
              url = item.get('download_info', {}).get('url', '')
              if not any(url == allowed[0] or url.startswith(prefix) for prefix in allowed[1:]):
                  raise SystemExit(f'candidate install used a non-public source: {url}')
          module = importlib.import_module(module_name)
          origin = Path(module.__file__).resolve()
          prefix = Path(sys.prefix).resolve()
          if prefix not in origin.parents:
              raise SystemExit(f'{module_name} did not load from this virtual environment: {origin}')
          Path(output).write_text(f'{module_name}={origin}\n')
          PY
          )

      - name: Rebuild and verify from the sdist
        env:
          RELEASE_ROOT: ${{ runner.temp }}/mountainash-release
          PACKAGE_IMPORT: mountainash_transport
        run: |
          sdist=$(find "$RELEASE_ROOT/dist" -maxdepth 1 -name '*.tar.gz' -print -quit)
          mkdir "$RELEASE_ROOT/rebuilt"
          env -i PATH="$PATH" HOME="$RELEASE_ROOT/home" PIP_CONFIG_FILE=/dev/null PIP_INDEX_URL=https://pypi.org/simple PIP_DISABLE_PIP_VERSION_CHECK=1 \
            python -I -m pip wheel --no-deps --index-url https://pypi.org/simple --wheel-dir "$RELEASE_ROOT/rebuilt" "$sdist"
          test "$(find "$RELEASE_ROOT/rebuilt" -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          env -i PATH="$PATH" HOME="$RELEASE_ROOT/home" PIP_CONFIG_FILE=/dev/null \
            python -I - "$RELEASE_ROOT/dist" "$RELEASE_ROOT/rebuilt" "$RELEASE_ROOT/evidence/sdist-metadata-comparison.json" <<'PY'
          import json
          import sys
          import zipfile
          from email.parser import Parser
          from pathlib import Path

          def metadata(directory):
              wheel, = Path(directory).glob('*.whl')
              with zipfile.ZipFile(wheel) as archive:
                  name = next(item for item in archive.namelist() if item.endswith('.dist-info/METADATA'))
                  parsed = Parser().parsestr(archive.read(name).decode())
              result = {
                  'filename': wheel.name,
                  'name': parsed['Name'],
                  'version': parsed['Version'],
                  'requires_python': parsed['Requires-Python'],
                  'requires_dist': sorted(parsed.get_all('Requires-Dist', [])),
                  'provides_extra': sorted(parsed.get_all('Provides-Extra', [])),
              }
              if any('@' in requirement for requirement in result['requires_dist']):
                  raise SystemExit(f'{wheel.name} contains a direct-reference dependency')
              return result

          original = metadata(sys.argv[1])
          rebuilt = metadata(sys.argv[2])
          keys = ('name', 'version', 'requires_python', 'requires_dist', 'provides_extra')
          if {key: original[key] for key in keys} != {key: rebuilt[key] for key in keys}:
              raise SystemExit(f'sdist wheel metadata differs: {original} != {rebuilt}')
          Path(sys.argv[3]).write_text(json.dumps({'original': original, 'rebuilt': rebuilt}, indent=2, sort_keys=True) + '\n')
          PY
          rebuilt=$(find "$RELEASE_ROOT/rebuilt" -maxdepth 1 -name '*.whl' -print -quit)
          python -m venv "$RELEASE_ROOT/sdist-venv"
          (
            cd "$RELEASE_ROOT"
            env -i PATH="$PATH" HOME="$RELEASE_ROOT/home" PIP_CONFIG_FILE=/dev/null PIP_INDEX_URL=https://pypi.org/simple PIP_DISABLE_PIP_VERSION_CHECK=1 \
              "$RELEASE_ROOT/sdist-venv/bin/python" -I -m pip install --isolated --no-input --index-url https://pypi.org/simple --report "$RELEASE_ROOT/evidence/sdist-install-report.json" "$rebuilt"
            env -i PATH="$PATH" HOME="$RELEASE_ROOT/home" PIP_CONFIG_FILE=/dev/null \
              "$RELEASE_ROOT/sdist-venv/bin/python" -I -m pip check
            env -i PATH="$PATH" HOME="$RELEASE_ROOT/home" PIP_CONFIG_FILE=/dev/null \
              "$RELEASE_ROOT/sdist-venv/bin/python" -I - "$RELEASE_ROOT/evidence/sdist-install-report.json" "$rebuilt" "$RELEASE_ROOT/evidence/sdist-module-origin.txt" "$PACKAGE_IMPORT" <<'PY'
          import importlib
          import json
          import sys
          from pathlib import Path

          report, candidate, output, module_name = sys.argv[1:]
          allowed = (Path(candidate).resolve().as_uri(), 'https://pypi.org/', 'https://files.pythonhosted.org/')
          for item in json.loads(Path(report).read_text()).get('install', []):
              url = item.get('download_info', {}).get('url', '')
              if not (url == allowed[0] or any(url.startswith(prefix) for prefix in allowed[1:])):
                  raise SystemExit(f'sdist install used a non-public source: {url}')
          module = importlib.import_module(module_name)
          origin = Path(module.__file__).resolve()
          prefix = Path(sys.prefix).resolve()
          if prefix not in origin.parents:
              raise SystemExit(f'{module_name} did not load from this virtual environment: {origin}')
          Path(output).write_text(f'{module_name}={origin}\n')
          PY
          )

      - name: Upload approved distributions
        id: upload-dist
        uses: actions/upload-artifact@v4
        with:
          name: release-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mountainash-release/dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload candidate evidence
        id: upload-evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mountainash-release/evidence
          if-no-files-found: error
          retention-days: 30

  preflight-pypi-environment:
    name: Require protected PyPI environment
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: build-and-verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: read
    steps:
      - name: Fail closed unless PyPI requires reviewers and main only
        uses: actions/github-script@v7
        with:
          script: |
            const parameters = {
              owner: context.repo.owner, repo: context.repo.repo, environment_name: 'pypi'
            };
            const {data: environment} = await github.rest.repos.getEnvironment(parameters);
            const reviewers = environment.protection_rules?.some(
              rule => rule.type === 'required_reviewers' && rule.reviewers?.length > 0
            );
            const {data: policies} = await github.rest.repos.listDeploymentBranchPolicies(parameters);
            const branch = policies.branch_policies[0];
            if (!reviewers || !environment.deployment_branch_policy?.custom_branch_policies ||
                policies.total_count !== 1 || branch?.name !== 'main' || branch?.type !== 'branch') {
              core.setFailed('pypi must require reviewers and allow only the main branch.');
            }

  publish:
    name: Publish approved artifacts to PyPI
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: [build-and-verify, preflight-pypi-environment]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download the exact approved distribution artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build-and-verify.outputs.dist-artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/candidate-dist

      - name: Download the exact approved evidence artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build-and-verify.outputs.evidence-artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/approved-evidence

      - name: Verify approved artifact hashes and isolate upload files
        env:
          CANDIDATE_DIST: ${{ runner.temp }}/candidate-dist
          APPROVED_EVIDENCE: ${{ runner.temp }}/approved-evidence
          PACKAGES_DIR: ${{ runner.temp }}/pypi-packages
        run: |
          python -I - "$CANDIDATE_DIST" "$APPROVED_EVIDENCE" "$PACKAGES_DIR" <<'PY'
          import hashlib
          import json
          import shutil
          import sys
          from pathlib import Path

          candidate, evidence, packages = map(Path, sys.argv[1:])
          release = json.loads((evidence / 'release.json').read_text())
          expected = release['files']
          actual_paths = {path.name: path for path in candidate.iterdir() if path.is_file()}
          if set(actual_paths) != set(expected) or len(actual_paths) != 2:
              raise SystemExit(f'approved artifact set mismatch: expected {sorted(expected)}, got {sorted(actual_paths)}')
          for name, expected_hash in expected.items():
              if hashlib.sha256(actual_paths[name].read_bytes()).hexdigest() != expected_hash:
                  raise SystemExit(f'hash mismatch for {name}')
          packages.mkdir()
          for path in actual_paths.values():
              shutil.copy2(path, packages / path.name)
          PY

      - name: Publish exactly the approved wheel and sdist
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: ${{ runner.temp }}/pypi-packages
          skip-existing: false

      - name: Confirm the public PyPI file set and hashes
        env:
          APPROVED_EVIDENCE: ${{ runner.temp }}/approved-evidence
          PUBLIC_EVIDENCE: ${{ runner.temp }}/publication-evidence
        run: |
          mkdir -p "$PUBLIC_EVIDENCE"
          python -I - "$APPROVED_EVIDENCE/release.json" <<'PY' > "$PUBLIC_EVIDENCE/public-request.txt"
          import json
          import sys
          release = json.load(open(sys.argv[1]))
          print(release['distribution'])
          print(release['version'])
          PY
          distribution=$(sed -n '1p' "$PUBLIC_EVIDENCE/public-request.txt")
          version=$(sed -n '2p' "$PUBLIC_EVIDENCE/public-request.txt")
          curl --fail --silent --show-error "https://pypi.org/pypi/${distribution}/${version}/json" > "$PUBLIC_EVIDENCE/public-pypi.json"
          python -I - "$APPROVED_EVIDENCE/release.json" "$PUBLIC_EVIDENCE/public-pypi.json" <<'PY'
          import json
          import sys
          approved = json.load(open(sys.argv[1]))['files']
          observed = {item['filename']: item['digests']['sha256'] for item in json.load(open(sys.argv[2]))['urls']}
          if observed != approved:
              raise SystemExit(f'public PyPI file set or hashes differ: expected {approved}, got {observed}')
          PY

      - name: Install and import the public PyPI release outside the checkout
        env:
          APPROVED_EVIDENCE: ${{ runner.temp }}/approved-evidence
          PUBLIC_EVIDENCE: ${{ runner.temp }}/publication-evidence
          PUBLIC_VENV: ${{ runner.temp }}/public-release-venv
          PACKAGE_IMPORT: mountainash_transport
        run: |
          distribution=$(python -I -c "import json; print(json.load(open('$APPROVED_EVIDENCE/release.json'))['distribution'])")
          version=$(python -I -c "import json; print(json.load(open('$APPROVED_EVIDENCE/release.json'))['version'])")
          mkdir -p "$PUBLIC_EVIDENCE/home"
          python -m venv "$PUBLIC_VENV"
          (
            cd "$PUBLIC_EVIDENCE"
            env -i PATH="$PATH" HOME="$PUBLIC_EVIDENCE/home" PIP_CONFIG_FILE=/dev/null PIP_INDEX_URL=https://pypi.org/simple PIP_DISABLE_PIP_VERSION_CHECK=1 \
              "$PUBLIC_VENV/bin/python" -I -m pip install --isolated --no-input --index-url https://pypi.org/simple --report "$PUBLIC_EVIDENCE/public-install-report.json" "${distribution}==${version}"
            env -i PATH="$PATH" HOME="$PUBLIC_EVIDENCE/home" PIP_CONFIG_FILE=/dev/null \
              "$PUBLIC_VENV/bin/python" -I -m pip check
            env -i PATH="$PATH" HOME="$PUBLIC_EVIDENCE/home" PIP_CONFIG_FILE=/dev/null \
              "$PUBLIC_VENV/bin/python" -I - "$PUBLIC_EVIDENCE/public-install-report.json" "$PUBLIC_EVIDENCE/public-module-origin.txt" "$PACKAGE_IMPORT" <<'PY'
          import importlib
          import json
          import sys
          from pathlib import Path

          report, output, module_name = sys.argv[1:]
          for item in json.loads(Path(report).read_text()).get('install', []):
              url = item.get('download_info', {}).get('url', '')
              if not (url.startswith('https://pypi.org/') or url.startswith('https://files.pythonhosted.org/')):
                  raise SystemExit(f'public install used a non-public source: {url}')
          module = importlib.import_module(module_name)
          origin = Path(module.__file__).resolve()
          prefix = Path(sys.prefix).resolve()
          if prefix not in origin.parents:
              raise SystemExit(f'{module_name} did not load from this virtual environment: {origin}')
          Path(output).write_text(f'{module_name}={origin}\n')
          PY
          )

      - name: Upload publication confirmation evidence
        uses: actions/upload-artifact@v4
        with:
          name: publication-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-evidence
          if-no-files-found: error
          retention-days: 30
