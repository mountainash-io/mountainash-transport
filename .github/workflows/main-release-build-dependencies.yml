name: Validate Main Release PR Dependencies

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: mountainash-io

      - name: Load dependencies
        id: dependencies
        uses: ./.github/actions/load-dependencies
        with:
          config-path: .github/config/mountainash_dependencies.yml

      - name: Check out main dependencies
        uses: ./.github/actions/checkout-dependencies
        with:
          dependencies: ${{ steps.dependencies.outputs.dependencies }}
          target-branch: main
          default-branch: main
          token: ${{ steps.app-token.outputs.token }}
          org-name: mountainash-io

      - name: Install Hatch
        run: python -m pip install --disable-pip-version-check --no-input hatch==1.18.0

      - name: Create build environment
        run: hatch env create build_github
