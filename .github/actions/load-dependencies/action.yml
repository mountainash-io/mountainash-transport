name: Load Dependencies
description: Parse the Mountain Ash dependency manifest into compact JSON.

inputs:
  config-path:
    description: Path to the dependency manifest.
    required: true
    default: .github/config/mountainash_dependencies.yml

outputs:
  dependencies:
    description: JSON array of dependency definitions.
    value: ${{ steps.parse.outputs.dependencies }}

runs:
  using: composite
  steps:
    - name: Install YAML parser
      shell: bash
      run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3

    - name: Parse dependency manifest
      id: parse
      shell: bash
      env:
        CONFIG_PATH: ${{ inputs.config-path }}
      run: |
        set -euo pipefail
        python - <<'PY'
        import json
        import os
        from pathlib import Path

        import yaml

        config_path = Path(os.environ["CONFIG_PATH"])
        try:
            document = yaml.safe_load(config_path.read_text())
        except (OSError, yaml.YAMLError) as error:
            raise SystemExit(f"Unable to parse dependency manifest {config_path}: {error}") from error

        dependencies = document.get("dependencies") if isinstance(document, dict) else None
        if not isinstance(dependencies, list):
            raise SystemExit("Dependency manifest must contain a dependencies list")

        for dependency in dependencies:
            if not isinstance(dependency, dict):
                raise SystemExit("Each dependency must be a mapping")
            if not isinstance(dependency.get("name"), str) or not dependency["name"]:
                raise SystemExit("Each dependency must have a non-empty name")
            if "org-name" in dependency and (
                not isinstance(dependency["org-name"], str) or not dependency["org-name"]
            ):
                raise SystemExit("Dependency org-name values must be non-empty strings")

        with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
            print(f"dependencies={json.dumps(dependencies, separators=(',', ':'))}", file=output)
        PY
