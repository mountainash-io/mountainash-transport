[metadata]
allow-direct-references = true

[version]
path = "src/mountainash_transport/__version__.py"

[build.targets.wheel]
packages = ["src/mountainash_transport"]

[build.targets.sdist]
include = ["/src", "/pyproject.toml", "/hatch.toml", "/requirements-hatch.txt", "/README.md", "/LICENSE", "/tools", "/tests/typing", "/docs/typing.md"]

#================
# Env: build_github
#================
[envs.build_github]
python = "3.12"
installer = "uv"
# Hatch installs the project before syncing environment dependencies.
dependencies = [
    "cyclonedx-bom==4.5.0",

    "mountainash_settings @    {root:uri}/temp/mountainash-settings",
    "mountainash_auth_client @ {root:uri}/temp/mountainash-auth-client",
]
[envs.build_github.scripts]
sbom-all = "cyclonedx-py environment > ./sbom-full.json"
sbom-direct = "cyclonedx-py requirements > ./sbom-direct.json"
export-requirements = "hatch dep show requirements > ./requirements.txt"

#================
# Env: default
#================
[envs.default]
python = "3.12"
installer = "uv"
path = ".venv"
dependencies = [
    "mountainash_settings @          {root:uri}/../mountainash-settings",
    "mountainash_auth_client @       {root:uri}/../mountainash-auth-client",
]

#================
# Env: test_github
#================
[[envs.test_github.matrix]]
python = ["3.12"]

[envs.test_github]
installer = "uv"
path = ".hatch/test-github"
dependencies = [
    "pytest==8.3.5",
    "pytest-check==2.5.3",
    "pytest-cov==6.1.1",

    "python-gnupg>=0.5.2",
    "paramiko==3.4.0",
    "boto3>=1.29.4,<=1.34.113",
    "authlib>=1.3.0",

    "mountainash_settings @    {root:uri}/temp/mountainash-settings",
    "mountainash_auth_client @ {root:uri}/temp/mountainash-auth-client",



]
[envs.test_github.scripts]
test = "pytest"
test-cov = "pytest --cov --cov-config={root}/pyproject.toml --junitxml=junit.xml -o junit_family=legacy --cov-report=xml"

#================
# Env: test
#================
[[envs.test.matrix]]
python = ["3.12"]

[envs.test]
installer = "uv"
path = ".hatch/test"
dependencies = [
    "coverage[toml]>=6.5",
    "pytest==8.3.5",
    "pytest-asyncio>=0.23.0",
    "pytest-check==2.5.3",
    "pytest-mock==3.12.0",
    "pytest-json-report>=1.5.0",
    "pytest-metadata>=2.0.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=4.1.0",
    "pytest-clarity>=1.0.1",
    "pytest-timeout>=2.1.0",
    "pytest-picked>=0.5.0",

    "python-gnupg>=0.5.2",
    "paramiko==3.4.0",
    "boto3>=1.29.4,<=1.34.113",
    "authlib>=1.3.0",

    "mountainash_settings @    {root:uri}/../mountainash-settings",
    "mountainash_auth_client @ {root:uri}/../mountainash-auth-client",
]
[envs.test.scripts]
# ===========================================
# CORE TESTING COMMANDS - Use these daily
# ===========================================

test = [
    "pytest --cov --cov-config={root}/pyproject.toml --junitxml=junit.xml",
    "coverage json --pretty-print",
    "coverage xml",
    "coverage html",
    "coverage report --show-missing",
]

# Quick testing for iteration (no coverage overhead)
test-quick = "pytest"

# ===========================================
# TARGETED TESTING - For debugging specific issues
# ===========================================

# Target specific files/tests with coverage
test-target = [
    "coverage run -m pytest {args}",
    "coverage json --pretty-print",
    "coverage report --show-missing",
]

# Target specific files/tests without coverage (fastest iteration)
test-target-quick = "pytest {args}"

# Only changed files (with coverage)
test-changed = [
    "coverage run -m pytest --picked",
    "coverage json --pretty-print",
    "coverage report --show-missing",
]

# Only changed files (without coverage)
test-changed-quick = "pytest --picked"

# ===========================================
# SPECIALIZED TESTING
# ===========================================

# Performance benchmarks only
test-perf = "pytest --benchmark-only"
test-perf-target = "pytest --benchmark-only {args}"

# Specific test markers
test-unit = "pytest -m unit"
test-integration = "pytest -m integration"
test-performance = "pytest -m performance"

# ===========================================
# CI/REPORTING - For automated environments
# ===========================================

# Full CI suite with all reports
test-ci = [
    "coverage run -m pytest --json-report --json-report-file=pytest_report.json --junitxml=junit.xml",
    "coverage json --pretty-print",
    "coverage xml",
    "coverage html",
    "coverage report --show-missing",
]

#================
# Env: ruff
#================
[envs.ruff]
installer = "uv"
# Own path: the tool envs must NOT share the project `.venv` (inherited from
# [envs.default]). Sharing it makes `hatch run ruff:...` and `hatch run test:...`
# thrash — each re-syncs `.venv` to its own disjoint dependency set, so whichever
# ran last leaves the other's binary missing.
path = ".hatch/ruff"
detached = true
dependencies = ["ruff==0.3.7"]
[envs.ruff.scripts]
check = "ruff check ./src"
fix = "ruff check ./src --fix"

#================
# Env: radon
#================
[envs.radon]
installer = "uv"
path = ".hatch/radon"          # own path — see [envs.ruff] note
detached = true
dependencies = ["radon==6.0.1"]
[envs.radon.scripts]
radon-cc = "radon cc ./src -nd"
radon-mi = "radon mi ./src -nd"
radon-cc-strict = "radon cc ./src -nc"
radon-mi-strict = "radon mi ./src -nc"
radon-mi-detail = "radon mi ./src"
radon-cc-detail = "radon cc ./src"

#================
# Env: mypy
#================
[envs.mypy]
python = "3.12"
installer = "uv"
path = ".hatch/mypy"           # own path — see [envs.ruff] note
# Optional SDK extras are installed so their imports are checked, with stubs
# pinned to the extras' versions. Provision here, not via --install-types.
features = ["s3", "sftp", "encryption"]
dependencies = [
    "mypy==1.10.1",
    "pytest==8.3.5",
    "build==1.2.2.post1",
    "hatchling==1.27.0",
    "boto3-stubs[s3]==1.34.113",
    "types-PyYAML==6.0.12.20260906",
    "types-paramiko==3.4.0.20240423",
    "google-api-core>=2.11",
]
[envs.mypy.scripts]
check = "mypy --warn-unused-ignores {args:src/mountainash_transport tests}"
check-src = "mypy --warn-unused-ignores src/mountainash_transport {args}"
check-tests = "mypy --warn-unused-ignores tests {args}"
check-src-untyped = "mypy --warn-unused-ignores --check-untyped-defs src/mountainash_transport {args}"
check-tests-untyped = "mypy --warn-unused-ignores --check-untyped-defs tests {args}"
qualify = "python tools/qualify_typing.py {args}"

[envs.mypy.env-vars]
UV_CONSTRAINT = "{root}/requirements-hatch.txt"
HATCH_SIBLINGS = "{root:uri}/.."

[envs.default.env-vars]
UV_CONSTRAINT = "{root}/requirements-hatch.txt"
HATCH_SIBLINGS = "{root:uri}/.."

[envs.test_github.env-vars]
UV_CONSTRAINT = "{root}/requirements-hatch.txt"
HATCH_SIBLINGS = "{root:uri}/temp"

[envs.build_github.env-vars]
UV_CONSTRAINT = "{root}/requirements-hatch.txt"
HATCH_SIBLINGS = "{root:uri}/temp"
