# Intelligent Textbook — MkDocs Material configuration.
# Generated by the init-textbook skill. Customize as the book grows.
# Use the book-installer skill to add features incrementally
# (math, mascot, slides, learning graph viewer, etc.).

site_name: "mountainash-transport"
site_description: "Package documentation for mountainash-transport: one file API across local disk, S3-compatible stores, SFTP and HTTP(S)."
site_author: "Nathaniel Ramm"
site_url: !ENV [TEXTBOOK_SITE_URL, 'https://docs.mountainash.io/mountainash-transport/']

# Hooks — runs local Python before/after page processing
# social_override.py lets per-page `image:` frontmatter override the auto-
# generated social card URL for og:image and twitter:image meta tags.
hooks:
  - plugins/social_override.py

# Repository
repo_name: "GitHub Repo"
repo_url: "https://github.com/mountainash-io/mountainash-transport"
edit_uri: !ENV [TEXTBOOK_EDIT_URI, 'edit/main/docs-site/site/docs/']

# Copyright
copyright: 'Copyright &copy; 2026 Nathaniel Ramm. Licensed under <a href="license/">CC BY-NC-SA 4.0</a> for non-commercial use.'

# Navigation
# IMPORTANT: do NOT add `navigation.tabs` — these books use side navigation
# optimized for wide landscape screens.
nav:
  - Home: index.md
  - Chapters:
      - List of Chapters: chapters/index.md
      - Concepts:
          - "1. What transport does": chapters/01-what-transport-does/index.md
          - "2. Transport in the Mountainash ecosystem": chapters/02-mountainash-ecosystem/index.md
      - Using the package:
          - "3. Installation and the package surface": chapters/03-installation/index.md
          - "4. Paths and scheme dispatch": chapters/04-paths-and-schemes/index.md
          - "5. Storage profiles and credentials": chapters/05-storage-profiles/index.md
          - "6. Opening storage with StorageFacade": chapters/06-storage-facade/index.md
          - "7. File operations": chapters/07-file-operations/index.md
          - "8. Location policy": chapters/08-location-policy/index.md
          - "9. Read access modes": chapters/09-read-access-modes/index.md
          - "10. Stream transforms and cross-backend copy": chapters/10-stream-transforms/index.md
          - "11. Connections, SSH and tunnels": chapters/11-connections/index.md
          - "12. The HTTP request engine": chapters/12-http-engine/index.md
      - Internals:
          - "13. Architecture: protocols and dispatch": chapters/13-architecture/index.md
          - "14. Backends": chapters/14-backends/index.md
          - "15. Maintaining and extending transport": chapters/15-maintaining/index.md
  - License: license.md
  - Contact: contact.md
  - About: about.md

# Theme configuration
theme:
  name: material
  # Once a logo is generated, point this at docs/img/logo.png or a mascot pose:
  # logo: img/logo.png
  # favicon: img/favicon.ico
  palette:
    primary: "light-blue"
    accent: "orange"
  include_sidebar: true
  features:
    - content.code.copy
    - content.action.edit
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share

# Plugins
plugins:
  - search
  # Uncomment after running `pip install "mkdocs-material[imaging]"`:
  # - social
  # Uncomment after running `pip install mkdocs-glightbox`:
  # - glightbox:
  #     touchNavigation: true
  #     loop: false
  #     effect: zoom
  #     slide_effect: slide
  #     width: 100%
  #     height: auto
  #     zoomable: true
  #     draggable: true
  #     auto_caption: false
  #     caption_position: bottom
  #     skip_classes:
  #       - mascot-admonition-img   # keep mascot poses out of the lightbox gallery

# Markdown extensions
markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

# Custom CSS — file is created by init-textbook
extra_css:
  - css/extra.css

# Custom JavaScript — uncomment once a corresponding file exists
# extra_javascript:
#   - js/extra.js

# Exclude prompt scratch files and TODOs from build/search/sitemap
exclude_docs: |
  **/image-prompt*.md
  **/image-prompts*.md
  **/cover-prompt.md
  **/TODO.md

# Rebuild on changes during `mkdocs serve`
watch:
  - docs
  - mkdocs.yml

# Extra
extra:
  # Suppress the "Made with Material for MkDocs" footer line
  generator: false

  # MicroSim build-status indicators shown next to nav entries.
  # The status value is set per-page in the index.md frontmatter:
  #   status: scaffold | built | approved
  # Colors are defined as CSS custom properties in docs/css/extra.css.
  # Note: `theme.icon.status` is a Material Insiders feature and is silently
  # ignored on community Material. Do not add it — the CSS-variable approach
  # in extra.css is the load-bearing piece on the community edition.
  status:
    scaffold: Scaffold — placeholder, not yet implemented
    built: Built — implementation complete, awaiting review
    approved: Approved — tested and approved

  # Intelligent-textbook URI scheme (see
  # https://dmccreary.github.io/intelligent-textbooks/uri-scheme/)
  schema: https://dmccreary.github.io/intelligent-textbooks/ns/textbook/v1
  textbook_name: "mountainash-transport"
  textbook_version: "2.0"

  # Google Analytics — uncomment once a property ID exists:
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX
